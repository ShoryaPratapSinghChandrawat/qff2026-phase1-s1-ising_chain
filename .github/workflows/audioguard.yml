name: AudioGuard reproducibility
on:
  pull_request:
    paths: ['AudioGuard/**', '.github/workflows/audioguard.yml']
  push:
    paths: ['AudioGuard/**', '.github/workflows/audioguard.yml']
  workflow_dispatch:
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            requirements: requirements.txt
            research: true
          - os: windows-latest
            requirements: requirements-core.txt
            research: false
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: AudioGuard
    env:
      GRADIO_ANALYTICS_ENABLED: 'False'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned direct dependencies
        run: python -m pip install --no-cache-dir -r ${{ matrix.requirements }}
      - name: Dependency consistency
        run: python -m pip check
      - name: Baseline smoke
        run: python scripts/smoke.py
      - name: Full research smoke
        if: matrix.research
        run: python scripts/research_smoke.py
      - name: Package actual source files
        run: python scripts/package.py
      - name: Validate extracted source archive
        if: matrix.research
        run: python scripts/verify_archive.py
      - name: Upload source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AudioGuard-source-${{ matrix.os }}
          path: AudioGuard-source.zip
      - name: Retain failures and synthetic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AudioGuard-validation-${{ matrix.os }}
          path: |
            AudioGuard/docs/*validation.json
            AudioGuard/results/**/status.json
            AudioGuard/results/**/failures.jsonl
