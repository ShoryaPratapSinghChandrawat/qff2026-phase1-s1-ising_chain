# Paths are relative to this workspace, NOT to this YAML file.
seed: 2026
dataset:
  root: data/ASVspoof2019_LA
  # First run `inspect`; then fill these from the actual discovered files.
  protocols:
    train: null
    dev: null
    eval: null
  audio_roots:
    train: null
    dev: null
    eval: null
  # null means every protocol trial, never an implicit subset.
  max_samples_per_partition: null
features:
  sample_rate: 16000
  frame_length: 400
  hop_length: 160
  fft_size: 512
  bands: 64
  log_floor: 1.0e-10
model:
  epochs: 200
  learning_rate: 0.05
  l2: 0.001
  batch_size: 256
  device: auto
robustness:
  # Noise is applied to eval waveforms only, using the clean dev threshold.
  snr_db: [20, 10, 0]
  mp3_bitrates_kbps: [64, 32]
  seed: 2026
output: results/baseline
